<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">NEX VEYRON — Systems Architect</title>
  <desc id="desc">Minimal dark terminal-inspired banner with the NEX VEYRON identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e7681" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c9d1d9" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6e7681" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="1000" cy="78" r="72" fill="#c9d1d9" opacity="0.04" filter="url(#soft)"/>
  <path d="M60 238H1140" stroke="url(#line)"/>
  <path d="M60 54H1140" stroke="#8b949e" stroke-opacity="0.12"/>
