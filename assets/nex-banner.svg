    <text x="64" y="150" font-size="46" font-weight="700" letter-spacing="1">SYSTEMS ARCHITECT</text>
    <text x="66" y="184" font-size="16" fill="#c9d1d9">data · infrastructure · finance · ai tooling</text>
    <text x="66" y="222" font-size="13" fill="#6e7681">observe → analyze → engineer → evolve</text>
  </g>
  <g transform="translate(1015 125)" fill="none" stroke="#c9d1d9" stroke-width="4" opacity="0.82">
